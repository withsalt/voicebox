[model]
model_type=campplus
model_file=campplus.onnx
sample_rate=16000
feature_dim=80
embedding_size=192
threshold=0.31
opset=17

[fbank]
# torchaudio.compliance.kaldi.fbank 默认参数 (modelscope SV pipeline 同款)
frame_length_ms=25
frame_shift_ms=10
num_mel_bins=80
window_type=povey
dither=0
preemphasis=0.97
remove_dc_offset=1
snip_edges=1
low_freq=20
high_freq=0
waveform_scale=32768
# 推理前逐段减均值 (CMN); 该步同时消除输入增益差异
apply_cmn=1
